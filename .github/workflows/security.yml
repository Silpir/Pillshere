name: Security & Dependency Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC catches newly disclosed advisories
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  osv-scan:
    name: OSV Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scans android-native/gradle/libs.versions.toml (Kotlin version catalog),
      # build files, and any other recognizable manifests found under ./
      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./


  codeql:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    # CodeQL requires GitHub Code Scanning to be enabled on the repository.
    # Until it is enabled in repo Settings → Security → Code security, skip
    # this job to avoid a hard failure on result upload.
    if: false
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
